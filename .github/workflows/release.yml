# Centralized release: build core for all platforms, upload to GitHub Releases,
# and optionally publish adapters (uncomment and add secrets when ready).
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-core:
    name: Build core binary
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: tgp.exe
          - os: ubuntu-latest
            artifact: tgp
          - os: macos-latest
            artifact: tgp
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install D (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y dub dmd

      - name: Install D (Windows)
        if: matrix.os == 'windows-latest'
        uses: dlang-actions/setup-dmd@v1
        with:
          version: '2.106.0'

      - name: Install D (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install dmd

      - name: Build
        run: |
          cd core
          dub build -b release
        env:
          # Ubuntu may need: sudo apt-get install -y libcurl4-openssl-dev
          DUBCONFIG: ${{ matrix.os == 'ubuntu-latest' && '--arch=x86_64' || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgp-${{ matrix.os }}
          path: core/${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build-core
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all core artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect binaries for release
        run: |
          mkdir -p release
          for dir in artifacts/tgp-*; do
            [ -d "$dir" ] || continue
            os=$(basename "$dir" | sed 's/tgp-//')
            for f in "$dir"/*; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              case "$os" in
                windows-latest) cp "$f" release/tgp-windows-x64.exe ;;
                ubuntu-latest)  cp "$f" release/tgp-linux-x64 ;;
                macos-latest)   cp "$f" release/tgp-macos-x64 ;;
                *) cp "$f" "release/tgp-$os-$base" ;;
              esac
            done
          done
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

