[project]
name = "terminal-gui-prompts"
version = "0.1.0"
description = "Adapter for TGP: confirm and prompt with GUI when available"
readme = "README.adoc"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terminal_gui_prompts"]
